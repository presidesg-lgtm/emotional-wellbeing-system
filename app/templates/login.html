<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Emotional Wellbeing Analysis System
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="page-shell">
        <section class="analysis-card auth-card">
            <div class="heading-group">
                <p class="eyebrow">
                    Emotional Wellbeing Support
                </p>

                <h1>Welcome back</h1>

                <p class="intro-text">
                    Log in to continue to your emotional
                    wellbeing account.
                </p>
            </div>

            {% with messages =
                get_flashed_messages(with_categories=true)
            %}
                {% for category, message in messages %}
                    <div class="message {{ category }}-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="post">
                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                >

                <button type="submit">
                    Log In
                </button>
            </form>

            <p class="auth-link">
                Don't have an account?

                <a href="{{ url_for('auth.register') }}">
                    Create one
                </a>
            </p>
        </section>
    </main>
</body>
</html>
