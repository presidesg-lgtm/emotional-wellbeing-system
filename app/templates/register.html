<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register | Emotional Wellbeing Analysis System
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="page-shell">
        <section class="analysis-card auth-card">
            <div class="heading-group">
                <p class="eyebrow">
                    Emotional Wellbeing Support
                </p>

                <h1>Create your account</h1>

                <p class="intro-text">
                    Register to access the emotional wellbeing
                    analysis system.
                </p>
            </div>

            {% with messages =
                get_flashed_messages(with_categories=true)
            %}
                {% for category, message in messages %}
                    <div class="message {{ category }}-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="full_name">
                    Full name
                </label>

                <input
                    id="full_name"
                    name="full_name"
                    type="text"
                    required
                >

                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    required
                >

                <label for="confirm_password">
                    Confirm password
                </label>

                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Create Account
                </button>
            </form>

            <p class="auth-link">
                Already have an account?

                <a href="{{ url_for('auth.login') }}">
                    Log in
                </a>
            </p>
        </section>
    </main>
</body>
</html>
